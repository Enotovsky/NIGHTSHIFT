services:
  nightshift:
    build:
      context: .
      dockerfile: Dockerfile
    image: nightshift-focus:latest
    container_name: nightshift-focus
    restart: unless-stopped
    # Host port is configurable via .env (APP_PORT), default 8100.
    # Left side = port on the VDS, right side = fixed container port (3000).
    ports:
      - "${APP_PORT:-8100}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
